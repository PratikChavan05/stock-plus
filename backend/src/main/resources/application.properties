spring.application.name=stockpulse
server.port=8080

# H2 — demo boots with zero external setup. Switch to Postgres via SPRING_DATASOURCE_* if needed.
spring.datasource.url=jdbc:h2:mem:stockpulse;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false

# LLM — keep keys in env, never in git. Empty key → AI advisor falls back to rules.
llm.provider=${LLM_PROVIDER:gemini}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:gemini-2.0-flash}
llm.base-url=${LLM_BASE_URL:https://generativelanguage.googleapis.com}
llm.timeout-ms=8000

# Commerce engine — change without a restart via PUT /commerce/strategy
# Options: rule-based, ai-based
commerce.strategy=${COMMERCE_STRATEGY:ai-based}
commerce.demand-spike-multiplier=3.0
commerce.demand-increase-multiplier=2.0
commerce.max-price-multiple=10
