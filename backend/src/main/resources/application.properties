spring.application.name=stockpulse

# Database Configuration
spring.datasource.url=jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.qzlwmainkmfbweshbluf
spring.datasource.password=${SUPABASE_PASSWORD:your_password_here}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Initial Data
spring.sql.init.mode=always
