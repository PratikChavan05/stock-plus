# LLM Configuration
llm.provider=gemini
llm.api-key=${GEMINI_API_KEY:your_api_key_here}
llm.model=gemini-1.5-flash
llm.base-url=https://generativelanguage.googleapis.com

# Commerce Strategy Configuration
# Options: rule-based, ai-based
commerce.strategy=ai-based
